<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Campus Token dual-token system</title>
  <desc id="desc">A visual showing verified attendance producing AToken, which converts on-chain to BToken rewards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b3f"/><stop offset="1" stop-color="#315c75"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d56d"/><stop offset="1" stop-color="#e8a948"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9cc59a"/><stop offset="1" stop-color="#5d906b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071824" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="48" fill="url(#bg)"/>
  <circle cx="1430" cy="110" r="240" fill="#fff" opacity=".035"/>
  <circle cx="120" cy="920" r="310" fill="#fff" opacity=".025"/>
  <text x="110" y="135" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="5">CAMPUS TOKEN</text>
  <text x="110" y="205" fill="#c9d9df" font-family="Arial,sans-serif" font-size="26">Verified attendance · On-chain rewards · Ethereum Sepolia</text>
  <g filter="url(#shadow)">
    <rect x="105" y="325" width="385" height="390" rx="36" fill="#f7f5ee"/>
    <circle cx="297" cy="448" r="68" fill="#315c75"/>
    <path d="M266 450l22 22 43-51" fill="none" stroke="#f7f5ee" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="297" y="575" text-anchor="middle" fill="#173448" font-family="Arial,sans-serif" font-size="34" font-weight="700">Attendance</text>
    <text x="297" y="622" text-anchor="middle" fill="#617580" font-family="Arial,sans-serif" font-size="23">Teacher-signed credential</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="750" cy="520" r="176" fill="url(#a)"/>
    <circle cx="750" cy="520" r="137" fill="none" stroke="#fff8dc" stroke-width="4" opacity=".75"/>
    <text x="750" y="535" text-anchor="middle" fill="#173448" font-family="Arial,sans-serif" font-size="112" font-weight="800">A</text>
    <text x="750" y="590" text-anchor="middle" fill="#173448" font-family="Arial,sans-serif" font-size="27" font-weight="700">PARTICIPATION</text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="1285" cy="520" r="176" fill="url(#b)"/>
    <circle cx="1285" cy="520" r="137" fill="none" stroke="#e8f4e8" stroke-width="4" opacity=".75"/>
    <text x="1285" y="535" text-anchor="middle" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="112" font-weight="800">B</text>
    <text x="1285" y="590" text-anchor="middle" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="27" font-weight="700">REWARD</text>
  </g>
  <path d="M492 520h76" stroke="#c9d9df" stroke-width="8" stroke-linecap="round"/>
  <path d="M555 494l30 26-30 26" fill="none" stroke="#c9d9df" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M928 520h120" stroke="#c9d9df" stroke-width="8" stroke-linecap="round"/>
  <path d="M1035 494l30 26-30 26" fill="none" stroke="#c9d9df" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="927" y="432" width="145" height="56" rx="28" fill="#f7f5ee" opacity=".12"/>
  <text x="999" y="468" text-anchor="middle" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="20" font-weight="700">ON-CHAIN</text>
  <text x="110" y="865" fill="#f7f5ee" font-family="Arial,sans-serif" font-size="50" font-weight="700">Participation becomes verifiable value.</text>
  <text x="110" y="920" fill="#c9d9df" font-family="Arial,sans-serif" font-size="25">Solidity · Hardhat · React · ethers.js · MetaMask</text>
</svg>